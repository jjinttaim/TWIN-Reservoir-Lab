<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="TWIN 연구용 댐 운영 시뮬레이터. 가상 자료로 시작하고 실제 CSV와 Excel 자료를 연결하세요."
    />
    <title>TWIN Reservoir Lab</title>
    <link rel="icon" type="image/png" href="assets/brand/twin-mark.png" />

    <script>
      // Some embedded browsers report a locale tag that Intl rejects; fall back to Korean.
      try { new Intl.NumberFormat(navigator.language); } catch (e) { Object.defineProperty(navigator, "language", { value: "ko-KR", configurable: true }); }

    <div id="toast" role="status" aria-live="polite"></div>
    <input id="dataFile" type="file" accept=".csv,.xlsx,.xls" hidden /><input
