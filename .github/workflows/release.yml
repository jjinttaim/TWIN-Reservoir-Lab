# Builds the Mac (arm64) and Windows (x64) desktop apps and publishes them as a GitHub Release.
# Runs when a version tag (v1.6.1 ...) is pushed, or on demand from the Actions tab (workflow_dispatch).
name: Release desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "버전 (예: 1.6.1). 같은 이름의 태그와 릴리스가 만들어지거나 갱신됩니다."
        required: true
        default: "1.6.1"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"; fi

  mac:
    needs: prepare
    runs-on: macos-14
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install packaging tools
        working-directory: app/desktop
        run: npm ci
      - name: Package (arm64)
        working-directory: app/desktop
        run: npm run pack:mac
      - name: Ad hoc sign and zip
        working-directory: app/desktop/out
        env:
          LC_ALL: en_US.UTF-8
        run: |
          cd "TWIN Reservoir Lab-darwin-arm64"
          codesign --force --deep --sign - "TWIN Reservoir Lab.app"
          cp ../../설치.command ../../설치안내.md .
          zip -y -r -q "../TWIN_Reservoir_Lab_${APP_VERSION}_mac_arm64.zip" "TWIN Reservoir Lab.app" 설치.command 설치안내.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: app/desktop/out/TWIN_Reservoir_Lab_*_mac_arm64.zip

  windows:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install packaging tools
        working-directory: app/desktop
        run: npm ci
      - name: Package (x64) and write icon and version resources
        working-directory: app/desktop
        run: npm run pack:win
      - name: Zip
        working-directory: app/desktop/out
        env:
          LC_ALL: C.UTF-8   # keeps Korean file names as UTF-8 inside the zip
        run: |
          mkdir -p build_win
          cp -r "TWIN Reservoir Lab-win32-x64" "build_win/TWIN Reservoir Lab"
          cp "../바로가기 만들기.bat" "../바로가기 지우기.bat" ../설치안내_Windows.txt "build_win/TWIN Reservoir Lab/"
          cd build_win && zip -r -q "../TWIN_Reservoir_Lab_${APP_VERSION}_win_x64.zip" "TWIN Reservoir Lab"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/desktop/out/TWIN_Reservoir_Lab_*_win_x64.zip

  release:
    needs: [prepare, mac, windows]
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - name: Collect files and checksums
        run: |
          mkdir -p release
          mv bundles/*.zip release/
          # GitHub strips non-ASCII characters from asset names, so the guides get ASCII names here.
          cp dist/읽어주세요.txt release/README_KO.txt
          cp dist/설치안내_Mac.txt release/INSTALL_Mac_KO.txt
          cp dist/설치안내_Windows.txt release/INSTALL_Windows_KO.txt
          cd release && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Remove assets from earlier runs that had mangled names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for a in default.txt _Mac.txt _Windows.txt; do
            gh release delete-asset "v${APP_VERSION}" "$a" -y --repo "${{ github.repository }}" 2>/dev/null || true
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: TWIN Reservoir Lab ${{ needs.prepare.outputs.version }}
          body_path: dist/RELEASE_NOTES_v${{ needs.prepare.outputs.version }}.md
          files: release/*
          make_latest: true
